# Build workflow: verify the repo, verify the GNU Emacs APK signature,
# unpack its contents, and assemble the emacshell APKs.
#
# Two flavors (termux / distro) are built on every push.  The custom
# bootstrap pins start life as PLACEHOLDER (see pins/bootstrap-README.md);
# until they are filled in, the assemble step is SKIPPED with a loud
# warning instead of producing an APK with an unusable prefix.  A
# wrong-prefix APK must never exist, so that state is preferred over a
# red build.
#
# Signing: when the EMACSHELL_KEYSTORE_B64 / EMACSHELL_KEYSTORE_PASSWORD
# secrets are configured, the APK is signed with apksigner; otherwise
# the unsigned APK is uploaded with a warning (see SECURITY.md for the
# key handling rules -- the keystore never lives in this repository).

name: build

on:
  push:
    branches: [ai/main, main]
  pull_request:
  workflow_dispatch:
    inputs:
      bootstrap_run_id:
        description: 'Run id of a completed "bootstrap" workflow whose artifacts to use'
        required: false
        default: ''

permissions:
  actions: read   # download-artifact from another workflow run
  contents: read

env:
  # GNU mirror serving /gnu/emacs/android/ (official mirror list:
  # https://www.gnu.org/prep/ftp.html).  Overridable for forks.
  GNU_MIRROR: https://mirrors.kernel.org/gnu/emacs/android
  # Google's byte-for-byte mirror of Maven Central: repo.maven.apache.org
  # 429s the shared runner IPs (run 45194666000).  settings.gradle puts
  # this ahead of mavenCentral() as the primary resolve source.
  MAVEN_CENTRAL_MIRROR: https://maven-central.storage-download.googleapis.com/maven2

jobs:
  verify:
    name: repo consistency checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scripts/check.sh
        run: scripts/check.sh

  build:
    name: build (${{ matrix.flavor }}, android${{ matrix.gnu_api == 29 && '10+' || '7-' }})
    needs: verify
    # ubuntu-latest migrated to 26.04 (Oct 2026) where
    # android-actions/setup-android@v3's sdkmanager call dies with
    # exit 1 while "Computing updates"; 24.04 is the proven image.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Single-ABI (arm64-v8a) by design; x86_64 joins when the GNU
        # APK pin matrix in pins/gnu-apk.sha256 grows.
        #
        # Two GNU APK api levels (see pins/gnu-apk.sha256): the number
        # in the GNU file name is the MINIMUM API the package supports,
        # so Android 10+ takes api 29 (default) and Android 9 or older
        # takes api 21.  Both are built on every push; minSdk,
        # versionCode and the APK name follow the api level.
        flavor: [termux, distro]
        gnu_api: [29, 21]
    env:
      FLAVOR: ${{ matrix.flavor }}
      GNU_API: ${{ matrix.gnu_api }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The hosted runners ship a preinstalled Android SDK at
      # ANDROID_HOME; android-actions/setup-android@v3 is currently
      # broken on them (its `sdkmanager --install tools
      # platform-tools` update pass exits 1 at "Computing updates"),
      # so use the preinstalled SDK directly and install ONLY the
      # pinned components that are missing.
      - name: Install SDK components (preinstalled SDK, gaps only)
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME}"
          install=""
          [ -d "${ANDROID_HOME}/platforms/android-36" ] \
            || install="${install} platforms;android-36"
          [ -d "${ANDROID_HOME}/build-tools/35.0.0" ] \
            || install="${install} build-tools;35.0.0"
          [ -d "${ANDROID_HOME}/ndk/27.0.12077973" ] \
            || install="${install} ndk;27.0.12077973"
          [ -d "${ANDROID_HOME}/platform-tools" ] \
            || install="${install} platform-tools"
          if [ -z "${install}" ]; then
            echo "all pinned SDK components are preinstalled; sdkmanager not needed"
            exit 0
          fi
          echo "missing:${install}"
          # sdkmanager is not on PATH on the hosted images; find it in
          # the preinstalled cmdline-tools (newest version wins).
          sdkm="$(ls -1 "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n1 || true)"
          if [ -z "${sdkm}" ]; then
            echo "::error::components missing (${install}) but no sdkmanager under ${ANDROID_HOME}/cmdline-tools"
            exit 1
          fi
          yes | "${sdkm}" --licenses > /dev/null || true
          # shellcheck disable=SC2086
          "${sdkm}" --install ${install}

      - name: Verify the GNU Emacs APK signature (supply chain)
        run: |
          set -euxo pipefail
          mkdir -p build/downloads
          # --retry-all-errors + mirror fallback: mirrors.kernel.org had
          # two partial outages today (runs 44332795379, 44366048965),
          # reachable only from SOME runner IPs.  ftp.gnu.org is the
          # canonical source.  The GPG check below authenticates the
          # apk end-to-end, so trying several GNU mirrors is exactly as
          # safe as trying one: a bad apk or sig fails verification
          # regardless of which mirror served it.
          curl() { command curl -fSL --retry 3 --retry-all-errors \
            --retry-delay 5 --connect-timeout 30 "$@"; }
          fetch() { # fetch <output-file> <relative-path-under-/gnu/emacs/android>
            for mirror in "${GNU_MIRROR}" \
                          https://ftp.gnu.org/gnu/emacs/android \
                          https://mirror.csclub.uwaterloo.ca/gnu/emacs/android; do
              if curl -o "$1" "${mirror}/$2"; then return 0; fi
              echo "::warning::mirror ${mirror} failed for $2; trying the next GNU mirror"
            done
            echo "::error::all GNU mirrors failed for $2"
            return 1
          }
          apk="build/downloads/emacs-31.1-${GNU_API}-arm64-v8a.apk"
          fetch "${apk}" "emacs-31.1-${GNU_API}-arm64-v8a.apk"
          fetch "${apk}.sig" "emacs-31.1-${GNU_API}-arm64-v8a.apk.sig"
          # Prefer the committed copy of the release key; fall back to
          # fetching it from ftp.gnu.org.  If BOTH fail the step fails:
          # an unverified Emacs binary must never enter an APK.
          if ! gpg --import keys/emacs-release-key.asc; then
            echo "::warning::committed key failed to import; fetching from ftp.gnu.org"
            curl https://ftp.gnu.org/gnu/emacs/emacs-release-key.asc | gpg --import
          fi
          gpg --verify "${apk}.sig" "${apk}"

      - name: Unpack the GNU APK (sha256-pinned)
        run: scripts/extract-gnu-apk.sh "${GNU_API}" arm64-v8a

      - name: Prepare pinned binary inputs (bootstrap / Alpine rootfs)
        id: pins
        env:
          BOOTSTRAP_RUN_ID: ${{ inputs.bootstrap_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pin="pins/bootstrap-${FLAVOR}.sha256"
          value="$(grep -vE '^[[:space:]]*(#|$)' "${pin}" | head -n1 | tr -d '[:space:]')"
          echo "bootstrap pin for '${FLAVOR}': ${value}"

          fetch_bootstrap_artifact() {
            gh run download "${BOOTSTRAP_RUN_ID}" \
              --name "bootstrap-${FLAVOR}" \
              --repo "${GITHUB_REPOSITORY}" \
              --dir "bootstrap/${FLAVOR}"
          }

          if [ "${value}" = "PLACEHOLDER" ]; then
            if [ -n "${BOOTSTRAP_RUN_ID}" ]; then
              fetch_bootstrap_artifact
              echo "::error::A bootstrap artifact was provided, but ${pin} is still a PLACEHOLDER. Review the artifact's sha256 and update the pin deliberately (pins/bootstrap-README.md); refusing to build unpinned."
              exit 1
            fi
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            {
              echo "### ${FLAVOR}: assemble skipped"
              echo ""
              echo "\`pins/bootstrap-${FLAVOR}.sha256\` is still a PLACEHOLDER, so no APK"
              echo "was produced: embedding the official (com.termux-prefixed) bootstrap"
              echo "would ship a shell that cannot run. Run the \`bootstrap\` workflow,"
              echo "review the zip, and fill in the pin."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          if [ ! -f "bootstrap/${FLAVOR}/bootstrap-aarch64.zip" ]; then
            if [ -n "${BOOTSTRAP_RUN_ID}" ]; then
              fetch_bootstrap_artifact
            else
              echo "ready=false" >> "${GITHUB_OUTPUT}"
              {
                echo "### ${FLAVOR}: assemble skipped"
                echo ""
                echo "The bootstrap pin is set but \`bootstrap/${FLAVOR}/bootstrap-aarch64.zip\`"
                echo "is absent. Re-run this workflow with bootstrap_run_id pointing at a"
                echo "completed \`bootstrap\` workflow run."
              } >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
          fi

          if [ "${FLAVOR}" = "distro" ]; then
            scripts/prepare-distro-rootfs.sh
          fi
          echo "ready=true" >> "${GITHUB_OUTPUT}"

      - name: Assemble APK
        id: assemble
        if: steps.pins.outputs.ready == 'true'
        run: |
          set -euo pipefail
          chmod +x gradlew
          cap="$(printf '%s' "${FLAVOR}" | sed 's/^./\U&/')"
          ./gradlew --no-daemon --stacktrace \
            "-PgnuApkApi=${GNU_API}" "assemble${cap}Release"

      - name: Sign the APK (or upload unsigned, with a warning)
        if: steps.assemble.outcome == 'success'
        env:
          KEYSTORE_B64: ${{ secrets.EMACSHELL_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.EMACSHELL_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk -name '*.apk' | head -n1)"
          if [ -z "${apk}" ]; then
            echo "::error::assemble reported success but no APK was found"
            exit 1
          fi
          if [ -z "${KEYSTORE_B64}" ]; then
            echo "::warning::EMACSHELL_KEYSTORE_B64 is not configured; the artifact is UNSIGNED. It carries no signature, so re-sign it locally with apksigner before installing (SECURITY.md)."
            exit 0
          fi
          printf '%s' "${KEYSTORE_B64}" | base64 --decode > /tmp/emacshell.jks
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" sign \
            --ks /tmp/emacshell.jks \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            "${apk}"
          rm -f /tmp/emacshell.jks
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --print-certs "${apk}"

      - name: Upload APK artifact
        if: steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: emacshell-${{ matrix.flavor }}-android${{ matrix.gnu_api == 29 && '10+' || '7-' }}-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
