# packages workflow: build the emacshell CUSTOM-PREFIX apt repository
# (GitHub Releases, absolute-URL flat repo) for one flavor.
#
# WHY: every Termux package hardcodes the prefix
# /data/data/com.termux/files/usr at build time.  Emacshell installs
# under its own applicationId, so the upstream repo cannot be used:
# dpkg dies with
#   error creating directory './data/data/com.termux': Permission denied
# (field report on v0.1.4).  The bootstrap already ships a
# custom-prefix package set; this workflow turns the SAME build into
# a servable repository so `pkg upgrade' and `pkg install' work.
#
# Layout produced (rolling release tag; the repository is named
# emacshell-packages -- termux flavor: emacshell-packages-v1, distro
# flavor: emacshell-packages-distro-v1):
#   Packages, Packages.gz, Release   the flat-repo index
#   *.deb                            every package built (bootstrap
#                                    set + subpackages)
#   bootstrap-aarch64.zip[.sha256]   convenience copy, same build
#   emacshell-<flavor>-*.apk[.sha256]
#                                    the current APKs, attached
#                                    from the latest v* release so
#                                    ONE release ships the repo
#                                    together with the app
#
# The sources.list on devices points at
#   deb [trusted=yes] \
#     https://github.com/khaalidrafi/emacshell/releases/download/emacshell-packages-v1 ./
#     (distro flavor: emacshell-packages-distro-v1)
# (written by TermuxInstaller.fixAptSourcesList on fresh installs and
# by M-x termux-fix-repo / site-start on existing ones).  apt follows
# the release-asset redirects; absolute Filename URLs in the Packages
# index are what make plain release assets work as a repo.
#
# Manual-dispatch only (1-2 h per flavor, same as bootstrap.yml);
# re-runs clobber the rolling tag's assets.  Assets for packages that
# disappeared from the build linger on the tag -- harmless (the index
# defines what apt sees) and noted in the release body.

name: packages

on:
  workflow_dispatch:
    inputs:
      flavors:
        description: 'Space-separated flavors to publish (termux distro)'
        required: false
        default: 'termux distro'
      extra_packages:
        description: 'Extra termux-packages to build into the repo (space-separated, e.g. "make perl"); big ones like clang add hours'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  repo:
    name: apt repo (${{ matrix.flavor }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        flavor: [termux, distro]
    steps:
      - uses: actions/checkout@v4

      - name: Repo consistency checks
        run: scripts/check.sh

      - name: Build the custom-prefix package set in the termux-packages Docker
        if: contains(github.event.inputs.flavors, matrix.flavor)
        run: |
          set -euo pipefail
          flavor="${{ matrix.flavor }}"
          # Bootstrap build first: produces the deb closure of the
          # bootstrap package set (with the emacshell patches from
          # scripts/build-bootstrap.sh applied to the pinned tree).
          # One retry after a 10-minute cool-down: the lane is 1-2 h
          # and dies on ANY single transient (run 45332393627 lost
          # both flavors to a Maven Central 429 burst; 45321600509 to
          # a mirrors.kernel.org stall -- patches 5 and 6 now ride
          # those out in-tree, this retry covers everything else).
          # Two failures in a row is a real bug, not a transient, so
          # exactly one retry.
          scripts/build-bootstrap.sh "$flavor" || {
            code=$?
            echo "::warning::bootstrap build failed (exit $code); one retry in 10 min"
            sleep 600
            scripts/build-bootstrap.sh "$flavor"
          }

      - name: Build extra packages requested for the repo
        if: contains(github.event.inputs.flavors, matrix.flavor) && github.event.inputs.extra_packages != ''
        run: |
          set -euo pipefail
          flavor="${{ matrix.flavor }}"
          app_id="$(sed -n "s/^applicationId$(printf '%s' "$flavor" | sed 's/^./\U&/')=//p" gradle.properties | tr -d '[:space:]')"
          src="build/termux-packages"
          [ -d "$src" ] || { echo "no termux-packages checkout (bootstrap step skipped?)"; exit 1; }
          cd "$src"
          # The pinned tree carries the emacshell patches from
          # scripts/build-bootstrap.sh; keep the same prefix env.
          for pkg in ${{ github.event.inputs.extra_packages }}; do
            echo "::group::building $pkg"
            TERMUX_DOCKER_EXEC_EXTRA_ARGS="--env TERMUX_APP__PACKAGE_NAME=${app_id} --env TERMUX_APP_PACKAGE=${app_id}" \
              ./scripts/run-docker.sh ./build-package.sh -I -a aarch64 "$pkg"
            echo "::endgroup::"
          done

      - name: Index the repository (flat, absolute URLs)
        if: contains(github.event.inputs.flavors, matrix.flavor)
        run: |
          set -euo pipefail
          flavor="${{ matrix.flavor }}"
          # The repository is named emacshell-packages (owner
          # request, 2026-11-25; retired the apt-<flavor>-v1 tags):
          # the termux flavor owns the bare name, other flavors
          # append theirs.
          case "$flavor" in
            termux) tag="emacshell-packages-v1" ;;
            *)      tag="emacshell-packages-${flavor}-v1" ;;
          esac
          base="https://github.com/${{ github.repository }}/releases/download/${tag}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils >/dev/null
          cd build/termux-packages/output
          echo "indexing $(ls -1 *.deb | wc -l) debs"
          apt-ftparchive packages . > Packages
          # Filename: must be absolute for a release-asset flat repo.
          # (apt-ftparchive writes either "./name.deb" or "name.deb";
          # normalize then prefix.)
          sed -i "s|^Filename: \\.\\/|Filename: |" Packages
          sed -i "s|^Filename: |Filename: ${base}/|" Packages
          # Epoch fix: apt-ftparchive renders epoch versions with a
          # COLON (pkg_1:2.3-4.deb) while termux-packages names the
          # artifact with a DOT (pkg_1.2.3-4.deb); the colon URLs 404.
          # Found on the apt-termux-v1 index (6 entries), fixed
          # 2026-11-25 during the emacshell-packages migration.
          sed -i '/^Filename: /s/_\([0-9]\+\):/_\1./g' Packages
          gzip -k -9 Packages
          apt-ftparchive -o APT::FTPArchive::Release::Origin="emacshell" \
                         -o APT::FTPArchive::Release::Suite="stable" \
                         -o APT::FTPArchive::Release::Codename="emacshell-${flavor}" \
                         release . > Release
          grep -c '^Filename: https://' Packages
          head -12 Packages

      - name: Publish to the rolling release tag
        if: contains(github.event.inputs.flavors, matrix.flavor)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin gh to THIS repo: the step runs inside
          # build/termux-packages/output, a clone of
          # termux/termux-packages, so gh's git-remote autodetection
          # targeted termux/termux-packages and died 403 (run
          # 45332393627's distro lane, "Resource not accessible by
          # integration").
          GH_REPO: ${{ github.repository }}
          # Same naming as the index step: the termux flavor owns the
          # bare emacshell-packages tag.
          TAG: ${{ matrix.flavor == 'termux' && 'emacshell-packages-v1' || format('emacshell-packages-{0}-v1', matrix.flavor) }}
        run: |
          set -euo pipefail
          flavor="${{ matrix.flavor }}"
          # gradle.properties lives at the repo root: read it BEFORE
          # cd'ing into the build output (run 45308285110 died here:
          # "sed: can't read gradle.properties").
          app_id="$(sed -n "s/^applicationId$(printf '%s' "$flavor" | sed 's/^./\U&/')=//p" gradle.properties | tr -d '[:space:]')"
          cd build/termux-packages/output
          notes="$(printf 'emacshell-packages: the custom-prefix apt repository (and the app itself) for the emacshell %s flavor.\n\nBuilt from the termux-packages release pinned in pins/termux-packages.txt with TERMUX_APP__PACKAGE_NAME=%s.\n\nUse on a device (sources.list):\n  deb [trusted=yes] https://github.com/%s/releases/download/%s ./\n\npkg/apt see exactly this repo (sources.list is written at bootstrap time by TermuxInstaller and repaired by M-x termux-fix-repo on older installs). The current APKs are attached alongside the packages, so this one release is everything the flavor needs. Packages beyond the bootstrap set%s are not served yet; re-run this workflow with the extra_packages input to grow it.' \
            "$flavor" "$app_id" '${{ github.repository }}' "$TAG" \
            "${{ github.event.inputs.extra_packages != '' && ' (plus the requested extras)' || '' }}")"
          gh release view "$TAG" --json name >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --notes "$notes"
          # Index files LAST: the repo only becomes usable when its
          # Packages index is visible, after every deb has landed.
          ls -1 *.deb | xargs -n 25 gh release upload "$TAG" --clobber
          gh release upload "$TAG" Packages Packages.gz Release --clobber
          # Convenience: the bootstrap zip of the same build.
          if [ -f "../../../bootstrap/${flavor}/bootstrap-aarch64.zip" ]; then
            cd "../../../bootstrap/${flavor}"
            sha256sum bootstrap-aarch64.zip > bootstrap-aarch64.zip.sha256
            gh release upload "$TAG" bootstrap-aarch64.zip bootstrap-aarch64.zip.sha256 --clobber || true
          fi

      # The repo release ships the app too (owner request,
      # 2026-11-25): pull this flavor's APKs from the latest
      # versioned release and upload them next to the packages.
      - name: "Attach the current APKs (one release: repo + app)"
        if: contains(github.event.inputs.flavors, matrix.flavor)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          flavor="${{ matrix.flavor }}"
          case "$flavor" in
            termux) tag="emacshell-packages-v1" ;;
            *)      tag="emacshell-packages-${flavor}-v1" ;;
          esac
          # gh release list prints newest first; the first tag that
          # looks like a version is the current APK release.
          apk_tag="$(gh release list --limit 100 | awk '$1 ~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ {print $1; exit}')"
          if [ -z "$apk_tag" ]; then
            echo "::warning::no versioned APK release found; skipping the APK attach"
            exit 0
          fi
          echo "attaching ${flavor} APKs from ${apk_tag} to ${tag}"
          rm -rf /tmp/apk && mkdir -p /tmp/apk
          gh release download "$apk_tag" --dir /tmp/apk --pattern "*-${flavor}-*.apk*"
          ls -1 /tmp/apk | xargs -n 2 gh release upload "$tag" --clobber
