# Emulator workflow: run the app on a real Android emulator and use it.
#
# Motivation (2026-11-23): "Emacshell termux API 29 didn't even run and
# immediately crash on my device. Please write tests that cover running
# and using the app via emulation."  The instrumented suite in
# app/src/androidTest runs INSIDE the app's own process on the emulator,
# so a crash at launch, a failed bootstrap extraction, a refused exec()
# of a bootstrap binary, or a dead usage bridge all surface as RED
# TESTS with a full logcat artifact -- instead of a silent device crash.
#
# One job on a Linux runner.  The APK is arm64-v8a-only (by design;
# see app/build.gradle), and hosted macOS runners cannot run emulators
# (no hypervisor: android-emulator-runner issue #458; both attempts on
# 2026-11-23 were cancelled before any step ran).  GitHub Linux runners
# have KVM, but the runner user is NOT in the kvm group -- without the
# udev rule below the action silently falls back to -accel off, which
# emulator 37.x refuses outright (run 45188039210).  With the rule, the
# API 35 google_apis x86_64 image boots under KVM and its ABI
# translation runs the arm64-v8a app transparently (the same issue
# documents exactly this config as THE way to run ARM-only apps on
# GitHub Actions).  The exec/SELinux rules under test key on the app's
# targetSdk, not the image version.
#
# Trigger: manual dispatch, plus pushes that touch the test suite, the
# app build file, the :emacs module or this workflow -- the emulator
# lane must not burn minutes on every docs typo.

name: emulator

on:
  workflow_dispatch:
  push:
    branches: [ai/main, main]
    paths:
      - 'app/build.gradle'
      - 'emacs/build.gradle'
      - 'app/src/androidTest/**'
      - 'app/src/debug/**'
      - 'scripts/emulator-smoke.sh'
      - 'scripts/extract-gnu-apk.sh'
      - 'scripts/gen-emacs-config.py'
      - '.github/workflows/emulator.yml'

permissions:
  actions: read   # download the bootstrap artifact of another run
  contents: read

env:
  GNU_MIRROR: https://mirrors.kernel.org/gnu/emacs/android
  # Google's byte-for-byte mirror of Maven Central: repo.maven.apache.org
  # 429s the shared runner IPs (run 45194666000).  settings.gradle puts
  # this ahead of mavenCentral() as the primary resolve source.
  MAVEN_CENTRAL_MIRROR: https://maven-central.storage-download.googleapis.com/maven2

jobs:
  emulator:
    name: assemble + emulator (API 35 x86_64, ARM translation)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Hosted ubuntu runners ship /dev/kvm with restrictive permissions
      # (the runner user is not in the kvm group).  Without this rule the
      # emulator-runner action logs "Disabling Linux hardware
      # acceleration" and launches with -accel off, which emulator 37.x
      # refuses (run 45188039210: "Software CPU emulation (-accel off)
      # is not supported").  This is the udev rule from the action's own
      # README; after it, the x86_64 image boots under KVM and the
      # arm64-v8a APK rides the image's ABI translation.
      - name: Enable KVM (runner user -> kvm group perms)
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install SDK components (preinstalled SDK, gaps only)
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME}"
          install=""
          [ -d "${ANDROID_HOME}/platforms/android-35" ] \
            || install="${install} platforms;android-35"
          [ -d "${ANDROID_HOME}/build-tools/35.0.0" ] \
            || install="${install} build-tools;35.0.0"
          [ -d "${ANDROID_HOME}/ndk/27.0.12077973" ] \
            || install="${install} ndk;27.0.12077973"
          [ -d "${ANDROID_HOME}/platform-tools" ] \
            || install="${install} platform-tools"
          if [ -z "${install}" ]; then
            echo "all pinned SDK components are preinstalled; sdkmanager not needed"
            exit 0
          fi
          echo "missing:${install}"
          sdkm="$(ls -1 "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n1 || true)"
          if [ -z "${sdkm}" ]; then
            echo "::error::components missing (${install}) but no sdkmanager under ${ANDROID_HOME}/cmdline-tools"
            exit 1
          fi
          yes | "${sdkm}" --licenses > /dev/null || true
          # shellcheck disable=SC2086
          "${sdkm}" --install ${install}

      - name: Verify the GNU Emacs APK signature (supply chain)
        run: |
          set -euxo pipefail
          mkdir -p build/downloads
          apk="build/downloads/emacs-31.1-29-arm64-v8a.apk"
          # --speed-time/-limit: a stalled transfer (run 45276313039
          # hung 35 s on zero bytes, then "Connection reset by peer")
          # must fail fast enough for --retry to actually re-fetch it.
          curl -fSL --retry 5 --retry-all-errors \
               --connect-timeout 30 --speed-time 60 --speed-limit 1024 \
               -o "${apk}" "${GNU_MIRROR}/emacs-31.1-29-arm64-v8a.apk"
          curl -fSL --retry 5 --retry-all-errors \
               --connect-timeout 30 --speed-time 60 --speed-limit 1024 \
               -o "${apk}.sig" "${GNU_MIRROR}/emacs-31.1-29-arm64-v8a.apk.sig"
          if ! gpg --import keys/emacs-release-key.asc; then
            echo "::warning::committed key failed to import; fetching from ftp.gnu.org"
            curl -fSL --retry 3 \
              https://ftp.gnu.org/gnu/emacs/emacs-release-key.asc | gpg --import
          fi
          gpg --verify "${apk}.sig" "${apk}"

      - name: Unpack the GNU APK (sha256-pinned)
        run: scripts/extract-gnu-apk.sh 29 arm64-v8a

      - name: Fetch the custom-prefix bootstrap artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --workflow=bootstrap.yml \
            --status=success --limit 1 --json databaseId \
            --jq '.[0].databaseId')"
          if [ -z "${run_id}" ]; then
            echo "::error::no successful 'bootstrap' workflow run found. Dispatch the bootstrap workflow once (it builds the custom-prefix bootstraps), then re-run this workflow."
            exit 1
          fi
          echo "using bootstrap run ${run_id}"
          gh run download "${run_id}" --name bootstrap-termux \
            --dir bootstrap/termux --repo "${GITHUB_REPOSITORY}"
          ls -l bootstrap/termux/

      - name: Assemble the debug APK and its androidTest APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          # Belt and suspenders on top of MAVEN_CENTRAL_MIRROR: the
          # mirror removes the repo.maven.apache.org 429s that killed run
          # 45194666000, but any other transient resolution failure still
          # gets a retry.  Gradle has no --retry-all-errors; --no-daemon
          # keeps attempts clean and the daemon's dependency cache makes
          # later ones cheap.
          n=0
          until [ "$n" -ge 3 ]; do
            if ./gradlew --no-daemon --stacktrace -PgnuApkApi=29 \
                 assembleTermuxDebug assembleTermuxDebugAndroidTest; then
              exit 0
            fi
            n=$((n + 1))
            echo "::warning::gradle assemble attempt ${n} failed; retrying in 60s"
            sleep 60
          done
          echo "::error::gradle assemble failed after 3 attempts"
          exit 1

      - name: Boot the emulator and run the smoke suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 35 google_apis x86_64: the documented config that runs
          # arm64-v8a-only APKs on hosted Linux runners via ABI
          # translation (android-emulator-runner issue #458).  KVM is
          # available on hosted ubuntu runners.
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: false
          disable-animations: true
          emulator-options: >-
            -no-snapshot-load -no-snapshot-save -no-window
            -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
            -feature -Vulkan
          # ONE line, on purpose: the action's parseScript() executes
          # every line of `script:` as its own `sh -c` process, so a
          # multi-line inline script loses all shell state between
          # lines (run 45244076439: APP_APK empty on its check line ->
          # "no app APK produced" right after BUILD SUCCESSFUL).  The
          # whole suite lives in the committed POSIX script below.
          script: sh scripts/emulator-smoke.sh

      - name: Upload instrumentation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-instrumentation-log
          path: |
            instrumentation.log
            emacshell-logcat.txt
          if-no-files-found: ignore
          retention-days: 14
