// :emacs -- GNU Emacs Android layer as an Android library.
//
// Contents:
//   java/  patched copy of the GNU Emacs 31.1 java/org/gnu/emacs sources
//          (generated by scripts/patch-emacs-java.py from the pristine
//          tarball; the patch series is asserted, never fuzzy)
//   res/   GNU Emacs 31.1 java/res, verbatim from the tarball
//   jniLibs/ + assets/  NOT committed; extracted from the official
//          GNU-built APK by scripts/extract-gnu-apk.sh (gitignored)
//
// This module never rebuilds Emacs C code.  libemacs.so and friends are
// the official GNU prebuilt binaries, which is what keeps emacshell a
// thin re-packaging rather than a fork of the Emacs build system.

plugins {
    id 'com.android.library'
}

android {
    namespace 'org.gnu.emacs'
    compileSdk project.properties.compileSdkVersion.toInteger()

    defaultConfig {
        minSdk project.properties.minSdkVersion.toInteger()
        consumerProguardFiles 'consumer-rules.pro'
    }

    // The flavors exist ONLY to compile a per-flavor BuildConfig constant
    // for EmacsNoninteractive, which resolves the application package
    // before any Android Context exists and therefore cannot call
    // Context.getPackageName().  Everything else in the Emacs layer uses
    // getPackageName() at runtime (see scripts/patch-emacs-java.py).
    flavorDimensions 'bundle'
    productFlavors {
        termux {
            buildConfigField 'String', 'EMACSHELL_PACKAGE_NAME',
                             "\"${project.properties.applicationIdTermux}\""
        }
        distro {
            buildConfigField 'String', 'EMACSHELL_PACKAGE_NAME',
                             "\"${project.properties.applicationIdDistro}\""
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// No external dependencies: the GNU Emacs Android Java layer uses only
// android.* and java.* APIs by design.
