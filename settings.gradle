// Emacshell Gradle settings.
//
// Gradle 8.14.3 + AGP 8.7.3 + JDK 17.  The termux-app v0.118.3 upstream
// build used Gradle 7.2 / AGP 4.2.2; we import their module SOURCES into
// this modern build instead (termux-app master has itself since moved to
// AGP 8.x, which validates that the sources build under it).

// CI-only Maven Central mirror.  repo.maven.apache.org rate-limits the
// shared IP pools of GitHub-hosted runners (429 Too Many Requests), which
// killed runs 45194666000 despite three whole-invocation retries.  When
// MAVEN_CENTRAL_MIRROR is set (the CI workflows set it to Google's
// byte-for-byte mirror of Maven Central), it is consulted FIRST so the
// canonical repository remains a pure fallback; local builds never set
// the variable and keep resolving from mavenCentral() directly.
// NOTE: pluginManagement {} must be the FIRST block of a settings script
// (Gradle hard rule -- run 45241700042 died on a top-level def before
// it), so the env var is read INSIDE each repositories block.

pluginManagement {
    repositories {
        def mavenCentralMirror = System.getenv('MAVEN_CENTRAL_MIRROR')
        if (mavenCentralMirror) maven { url mavenCentralMirror }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        def mavenCentralMirror = System.getenv('MAVEN_CENTRAL_MIRROR')
        if (mavenCentralMirror) maven { url mavenCentralMirror }
        google()
        mavenCentral()
        // Termux module dependencies (markwon et al.) all resolve from
        // mavenCentral; jitpack is kept because some termux-app forks
        // pull androidx.window snapshots from it and we may follow suit.
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = 'emacshell'

include ':app', ':emacs', ':termux-shared', ':terminal-emulator', ':terminal-view'
