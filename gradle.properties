# Emacshell Gradle properties.
org.gradle.jvmargs=-Xmx4096M \
  --add-exports=java.base/sun.nio.ch=ALL-UNNAMED \
  --add-opens=java.base/java.lang=ALL-UNNAMED \
  --add-opens=java.base/java.lang.reflect=ALL-UNNAMED \
  --add-opens=java.base/java.io=ALL-UNNAMED \
  --add-exports=jdk.unsupported/sun.misc=ALL-UNNAMED
android.useAndroidX=true

# Toolchain pins (see BUILD.org for the rationale).
# compileSdk 36 (Android 16 / Baklava): Emacs 31.1's java layer tests
# Build.VERSION_CODES.BAKLAVA (EmacsActivity) -- android.jar 35 does
# not carry that constant, so 35 cannot compile the vendored sources.
# AGP 8.7.3 is only tested up to 35; the mismatch is warning-only.
compileSdkVersion=36
minSdkVersion=24
targetSdkVersion=28
android.suppressUnsupportedCompileSdk=36
# termux-app master builds the same native sources with NDK r29; AGP
# 8.7.3 ships with r27 by default, which is what CI installs.
ndkVersion=27.0.12077973
markwonVersion=4.6.2

# The two emacshell applicationIds.  They must differ from org.gnu.emacs
# and com.termux (side-by-side installability is project law) and from
# each other.  Centralized here so :app, :emacs and :termux-shared stay
# in sync.
applicationIdTermux=tech.khalidrafi.emacshell.termux
applicationIdDistro=tech.khalidrafi.emacshell.distro
